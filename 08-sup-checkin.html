<!doctype html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Check-in SUP</title>
        <link rel="stylesheet" href="assets/css/styles.css" />
    </head>
    <body class="app-screen">
        <!-- Khung màn hình -->
        <main class="phone premium-phone">
            <div class="statusbar"> <span>09:41</span><span class="status-right"><i class="signal"><i></i><i></i><i></i></i><i class="wifi"></i><i class="battery"></i></span></div>
            <!-- Thanh tiêu đề và điều hướng -->
            <header class="appbar simple">
                <button class="icon-btn" data-back data-href="04-store-detail.html"><svg class="ico"><use href="assets/images/icons.svg#back" /></svg></button>
                <h1>Check-in SUP</h1>
                <span></span>
            </header>
            <!-- Nội dung chính -->
            <section class="content">
                <div class="checkin-page">
                    <div class="checkin-store">
                        <svg class="ico"><use href="assets/images/icons.svg#store" /></svg>
                        <div> <b>CH An Phú</b><small>CH001 · Trong bán kính check-in</small></div>
                        <span class="badge green">Hợp lệ</span>
                    </div>
                    <section class="checkin-section">
                        <h2>Ca: S</h2>
                        <div class="checkin-tabs">
                            <button class="active" type="button">Chấm công vào</button>
                            <button type="button">Chấm công ra</button>
                        </div>
                        <div class="checkin-capture">
                            <div class="captured-photo"> <span>Vị trí đã xác thực</span><b>15:33:51 · 10-11-2026</b></div>
                            <button class="camera-tile" type="button" data-action data-message="Đã mở camera"><svg class="ico"><use href="#camera" /></svg><span>Chụp ảnh</span></button>
                        </div>
                    </section>
                    <section class="checkin-section">
                        <h2>Thông tin ca làm việc</h2>
                        <div class="attendance-grid"> <b>Ký hiệu</b><b>Thời gian IN/OUT</b><b>Ghi chú</b><span>S</span><span><strong>IN:</strong> 06:00 10-11-2026<br><strong>OUT:</strong> 16:00 10-11-2026</span><span>Ca sáng</span></div>
                    </section>
                </div>
            </section>
            <div class="bottom-actions">
                <button class="btn primary" type="button" data-action data-message="Đã ghi nhận check-in lúc 09:41"><svg class="ico"><use href="assets/images/icons.svg#check" /></svg>Xác nhận check-in</button>
            </div>
            <div class="toast"></div>
        </main>
        <!-- Scripts: dữ liệu → chức năng → khởi tạo; giữ thứ tự này. -->
        <script src="assets/js/demo-data.js"></script>
        <script src="assets/js/icons.js"></script>
        <script src="assets/js/core.js"></script>
        <script src="assets/js/map.js"></script>
        <script src="assets/js/modals.js"></script>
        <script src="assets/js/employees.js"></script>
        <script src="assets/js/filters.js"></script>
        <script src="assets/js/checkin.js"></script>
        <script src="assets/js/evaluation.js"></script>
        <script src="assets/js/reports.js"></script>
        <script src="assets/js/stores.js"></script>
        <script src="assets/js/app.js"></script>
    </body>
</html>
