<!doctype html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Đánh giá SA</title>
        <link rel="stylesheet" href="assets/css/styles.css" />
    </head>
    <body class="app-screen">
        <!-- Khung màn hình -->
        <main class="phone premium-phone">
            <div class="statusbar"> <span>09:41</span><span class="status-right"><i class="signal"><i></i><i></i><i></i></i><i class="wifi"></i><i class="battery"></i></span></div>
            <!-- Thanh tiêu đề và điều hướng -->
            <header class="appbar simple">
                <button class="icon-btn" data-back data-href="04-store-detail.html"><svg class="ico"><use href="assets/images/icons.svg#back" /></svg></button>
                <h1>Đánh giá SA</h1>
                <span></span>
            </header>
            <!-- Nội dung chính -->
            <section class="content">
                <div class="evaluation-page">
                    <div class="evaluation-store"> <svg class="ico"><use href="assets/images/icons.svg#store" /></svg><span><b>CH An Phú</b><small>Đánh giá dịch vụ tại cửa hàng</small></span></div>
                    <p class="evaluation-note">Chọn mức đánh giá cho từng tiêu chí. Bạn có thể cập nhật trước khi gửi.</p>
                    <div class="rating-list">
                        <section class="rating-item">
                            <div> <b>Tác phong &amp; đồng phục</b><small>Gọn gàng, đúng nhận diện</small></div>
                            <div class="rating-stars" aria-label="4 trên 5 sao">
                                <button class="selected">★</button>
                                <button class="selected">★</button>
                                <button class="selected">★</button>
                                <button class="selected">★</button>
                                <button>★</button>
                            </div>
                        </section>
                        <section class="rating-item">
                            <div> <b>Tư vấn khách hàng</b><small>Chủ động, rõ ràng và thân thiện</small></div>
                            <div class="rating-stars">
                                <button class="selected">★</button>
                                <button class="selected">★</button>
                                <button class="selected">★</button>
                                <button class="selected">★</button>
                                <button class="selected">★</button>
                            </div>
                        </section>
                        <section class="rating-item">
                            <div> <b>Trưng bày sản phẩm</b><small>Sạch sẽ, đầy đủ bảng giá</small></div>
                            <div class="rating-stars">
                                <button class="selected">★</button>
                                <button class="selected">★</button>
                                <button class="selected">★</button>
                                <button>★</button>
                                <button>★</button>
                            </div>
                        </section>
                    </div>
                    <label class="evaluation-comment">
                        Ghi chú
                        <textarea placeholder="Nhập nhận xét cho cửa hàng..."></textarea>
                    </label>
                </div>
            </section>
            <div class="bottom-actions">
                <button class="btn primary" type="button" data-action data-message="Đã gửi đánh giá SA"><svg class="ico"><use href="assets/images/icons.svg#check" /></svg>Gửi đánh giá</button>
            </div>
            <div class="toast"></div>
        </main>
        <!-- Scripts: dữ liệu → chức năng → khởi tạo; giữ thứ tự này. -->
        <script src="assets/js/demo-data.js"></script>
        <script src="assets/js/icons.js"></script>
        <script src="assets/js/core.js"></script>
        <script src="assets/js/map.js"></script>
        <script src="assets/js/modals.js"></script>
        <script src="assets/js/employees.js"></script>
        <script src="assets/js/filters.js"></script>
        <script src="assets/js/checkin.js"></script>
        <script src="assets/js/evaluation.js"></script>
        <script src="assets/js/reports.js"></script>
        <script src="assets/js/stores.js"></script>
        <script src="assets/js/app.js"></script>
    </body>
</html>
