<!doctype html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Nhân viên hoàn thành</title>
        <link rel="stylesheet" href="assets/css/styles.css" />
    </head>
    <body class="app-screen">
        <!-- Khung màn hình -->
        <main class="phone premium-phone">
            <div class="statusbar"> <span>09:41</span></div>
            <!-- Thanh tiêu đề và điều hướng -->
            <header class="appbar simple">
                <button class="icon-btn" data-back data-href="01-map-overview.html"><svg class="ico"><use href="assets/images/icons.svg#back" /></svg></button>
                <h1>Nhân viên hoàn thành</h1>
                <span></span>
            </header>
            <!-- Nội dung chính -->
            <section class="content">
                <div class="location-body out-list-body">
                    <div class="notice success"> <svg class="ico"><use href="assets/images/icons.svg#check" /></svg><span>Nhân viên đã hoàn thành toàn bộ cửa hàng trong lịch làm việc hôm nay.</span></div>
                    <div class="search"> <svg class="ico"><use href="assets/images/icons.svg#search" /></svg><input type="search" placeholder="Tìm nhân viên..." data-employee-search /></div>
                    <div class="list-summary-row">
                        <p class="out-list-summary"><b data-employee-count>6</b> nhân viên hoàn thành</p>
                        <span class="status-legend complete-legend"><i></i> Hoàn thành</span>
                    </div>
                    <div class="cards employee-list">
                        <article class="card completed-card" data-employee-card data-employee-name="Nguyễn Thị Mai" data-employee-store="CH An Phú">
                            <div class="card-head">
                                <span class="avatar completed-avatar">NM</span>
                                <div>
                                    <div class="person-name"> Nguyễn Thị Mai </div>
                                    <span class="badge orange">Hoàn thành</span>
                                </div>
                                <svg class="ico"><use href="assets/images/icons.svg#check" /></svg>
                            </div>
                            <div class="info-lines">
                                <button class="completed-total-link" data-href="12-completed-stores.html"><svg class="ico"><use href="assets/images/icons.svg#store" /></svg><span>Tổng <b>3 cửa hàng</b> đã hoàn thành</span><svg class="ico"><use href="assets/images/icons.svg#chevron" /></svg></button>
                            </div>
                        </article>
                        <article class="card completed-card" data-employee-card data-employee-name="Phạm Quốc Bảo" data-employee-store="CH Minh Khai">
                            <div class="card-head">
                                <span class="avatar completed-avatar">PB</span>
                                <div>
                                    <div class="person-name"> Phạm Quốc Bảo </div>
                                    <span class="badge orange">Hoàn thành</span>
                                </div>
                                <svg class="ico"><use href="assets/images/icons.svg#check" /></svg>
                            </div>
                            <div class="info-lines">
                                <button class="completed-total-link" data-href="12-completed-stores.html"><svg class="ico"><use href="assets/images/icons.svg#store" /></svg><span>Tổng <b>2 cửa hàng</b> đã hoàn thành</span><svg class="ico"><use href="assets/images/icons.svg#chevron" /></svg></button>
                            </div>
                        </article>
                        <article class="card completed-card" data-employee-card data-employee-name="Võ Minh Tuấn" data-employee-store="CH Hoàng Diệu">
                            <div class="card-head">
                                <span class="avatar completed-avatar">VT</span>
                                <div>
                                    <div class="person-name"> Võ Minh Tuấn </div>
                                    <span class="badge orange">Hoàn thành</span>
                                </div>
                                <svg class="ico"><use href="assets/images/icons.svg#check" /></svg>
                            </div>
                            <div class="info-lines">
                                <button class="completed-total-link" data-href="12-completed-stores.html"><svg class="ico"><use href="assets/images/icons.svg#store" /></svg><span>Tổng <b>4 cửa hàng</b> đã hoàn thành</span><svg class="ico"><use href="assets/images/icons.svg#chevron" /></svg></button>
                            </div>
                        </article>
                        <p class="out-empty" hidden>Không tìm thấy nhân viên phù hợp.</p>
                    </div>
                </div>
            </section>
            <div class="toast"></div>
        </main>
        <!-- Scripts: dữ liệu → chức năng → khởi tạo; giữ thứ tự này. -->
        <script src="assets/js/demo-data.js"></script>
        <script src="assets/js/icons.js"></script>
        <script src="assets/js/core.js"></script>
        <script src="assets/js/map.js"></script>
        <script src="assets/js/modals.js"></script>
        <script src="assets/js/employees.js"></script>
        <script src="assets/js/filters.js"></script>
        <script src="assets/js/checkin.js"></script>
        <script src="assets/js/evaluation.js"></script>
        <script src="assets/js/reports.js"></script>
        <script src="assets/js/stores.js"></script>
        <script src="assets/js/app.js"></script>
    </body>
</html>
